services:
  mediaflow:
    image: ghcr.io/mhdzumair/mediaflow-proxy-light:1.1.2
    container_name: mediaflow
    restart: unless-stopped
    # distroless "nonroot"; the image defaults to root but needs no privileges.
    user: "65532:65532"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Stateless: caches live in memory, nothing is written to disk.
    read_only: true
    pids_limit: 256
    # No healthcheck: the image is distroless (no shell, no curl) and the
    # binary has no health subcommand. Check GET /health from outside instead.
    environment:
      API_PASSWORD: "${API_PASSWORD:?}"
      # On by default, but the image ships no ffmpeg.
      APP__TRANSCODE__ENABLED: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Private access (SSH tunnel or VPN) to the web UI and /metrics, which
      # Caddy hides by default. Never bind it to a public interface.
      - "${INTERFACE:?}:8888:8888"
    networks:
      - satellite

networks:
  satellite:
    external: true
