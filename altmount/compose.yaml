services:
  altmount:
    image: ghcr.io/javi11/altmount:0.3.2
    container_name: altmount
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # linuxserver base: s6 starts as root, fixes /config ownership, then
    # drops to the unprivileged abc user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /run:exec
      - /tmp
      # Declared as a volume by the image but unused (metadata lives under
      # /config); a tmpfs keeps Docker from creating an anonymous volume.
      - /metadata
    pids_limit: 512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/live"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
    environment:
      # Signs web UI sessions.
      JWT_SECRET: "${JWT_SECRET:?}"
      # The host the web UI is opened at: the session cookie's domain. Also
      # required at startup, or AltMount refuses its wildcard CORS default.
      COOKIE_DOMAIN: "${INTERFACE:?}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Tailnet-only access to the web UI and the API AIOStreams calls. Caddy
      # only exposes the player stream endpoint publicly.
      - "${INTERFACE:?}:8080:8080"
    volumes:
      # Config, database and NZB metadata (metadata.root_path defaults to
      # /config/metadata).
      - data:/config
    networks:
      - satellite

volumes:
  data:

networks:
  satellite:
    external: true
